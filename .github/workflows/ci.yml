name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Build, lint, typecheck, unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test

  integration:
    name: Integration (real cypress run) — cypress ${{ matrix.cypress }}
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        # Validates the `peerDependencies.cypress` range declared in
        # package.json (">=12.0.0") empirically, not just by assertion —
        # each leg installs its own Cypress version over the one from
        # package-lock before running the real end-to-end suite.
        #
        # The peer range is open-ended, so this matrix can only ever prove
        # the majors that existed when it was last touched. Add a leg when
        # Cypress ships a new major; the range itself needs no edit.
        cypress: ['^12.0.0', '^13.0.0', '^14.0.0', '^15.0.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Cypress binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ matrix.cypress }}-${{ hashFiles('package.json') }}
      - name: Install with matrix Cypress version
        # Deliberately a full, fresh resolution rather than `npm ci` followed
        # by `npm install --no-save cypress@X`. That incremental form trips
        # npm's optional-dependency pruning bug (npm/cli#4828): re-resolving
        # one package silently drops platform-specific binaries —
        # @rollup/rollup-linux-x64-gnu, esbuild's — and the build then dies
        # with a MODULE_NOT_FOUND that points nowhere near the real cause.
        # Reproduced locally twice while adding the ^15 leg. Costs ~20s more
        # per leg than `npm ci`; worth it for a matrix that otherwise fails
        # confusingly and intermittently.
        run: |
          npm pkg set devDependencies.cypress="${{ matrix.cypress }}"
          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund
      - run: npm run build
      - run: npx cypress install
      - run: npx cypress verify
      - run: npm run test:integration

  example:
    name: Example project (packaged tarball smoke test)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build

      # Install the LOCAL build into the example as a real packed tarball
      # rather than linking src/. That exercises package.json's `files` and
      # `exports` maps exactly as a consumer would — the one failure class no
      # local typecheck/lint/test can see, because it only exists in the
      # published artifact. Overrides the example's own `^0.2.0` npm
      # dependency, so this tests the code in the commit, not what's on npm.
      #
      # Note this rewrites examples/basic/package.json's dependency to a
      # `file:` path. That is fine here — the checkout is ephemeral — but it
      # means running these steps locally will dirty that file; `git checkout
      # examples/` afterwards.
      - name: Pack and install into examples/basic
        run: |
          TARBALL="$(npm pack --silent | tail -1)"
          cd examples/basic
          npm install --no-audit --no-fund "../../$TARBALL"

      - name: Cypress binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-example-${{ runner.os }}-${{ hashFiles('examples/basic/package.json') }}
      - name: Install Cypress binary
        working-directory: examples/basic
        run: npx cypress install

      # Run it exactly as examples/basic/README.md tells a user to. This is
      # the check that would have caught the example drifting to document a
      # removed QUALFLARE_TOKEN upload flow: nothing else in CI ever executes
      # the example project.
      #
      # `|| true` is deliberate and load-bearing: these specs cy.visit() the
      # public example.cypress.io, so a red run can mean that site is slow or
      # down, which says nothing about this package. What is being asserted is
      # narrower and fully under our control — that the example installs, the
      # plugin registers, and a report gets written. The next step fails the
      # job if any of that is untrue.
      - name: Run the example as its README documents
        working-directory: examples/basic
        run: npm test || true

      - name: Assert it produced a usable report
        working-directory: examples/basic
        run: |
          node -e '
            const fs = require("node:fs");
            const dir = "qualflare-results";
            if (!fs.existsSync(dir)) throw new Error(`${dir} was never created — the plugin never ran`);
            const reports = fs.readdirSync(dir).filter((f) => f.endsWith(".json"));
            if (reports.length !== 1) throw new Error(`expected 1 report, found ${reports.length}`);
            const payload = JSON.parse(fs.readFileSync(`${dir}/${reports[0]}`, "utf8"));
            const cases = payload.suites.flatMap((s) => s.cases);
            if (cases.length === 0) throw new Error("report contains no cases");
            console.log(`OK: ${payload.suites.length} suite(s), ${cases.length} case(s)`);
          '
