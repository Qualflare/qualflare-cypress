name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Build, lint, typecheck, unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test

  integration:
    name: Integration (real cypress run) — cypress ${{ matrix.cypress }}
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        # Validates the `peerDependencies.cypress` range declared in
        # package.json (">=12.0.0 <15.0.0") empirically, not just by
        # assertion — each leg installs its own Cypress version over the
        # one from package-lock before running the real end-to-end suite.
        cypress: ['^12.0.0', '^13.0.0', '^14.0.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Install matrix Cypress version
        run: npm install --no-save "cypress@${{ matrix.cypress }}"
      - run: npm run build
      - name: Cypress binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ matrix.cypress }}-${{ hashFiles('package-lock.json') }}
      - run: npx cypress install
      - run: npx cypress verify
      - run: npm run test:integration
